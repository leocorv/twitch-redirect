
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirection Twitch</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <script>
    const pseudo = "nerixtv";

    const appUrl = `twitch://stream/${pseudo}`;
    const webUrl = `https://www.twitch.tv/${pseudo}`;

    // Tentative immédiate d'ouverture de Twitch
    window.location.replace(appUrl);
  </script>

  <p>
    Si Twitch ne s'ouvre pas automatiquement,
    <a id="fallback" href="#">ouvrir le live</a>.
  </p>

  <script>
    document.getElementById("fallback").href =
      `https://www.twitch.tv/${pseudo}`;
  </script>
</body>
</html>
